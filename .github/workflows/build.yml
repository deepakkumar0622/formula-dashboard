name: Build Next.js and Push to Dev Branch

on:
  push:
    branches:
      - dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: production

    steps:
      # Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install Node.js
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      # Install dependencies (clean & reproducible)
      - name: Install dependencies
        run: npm ci

      # Build Next.js (standalone)
      - name: Build Next.js app
        run: npm run build

      # Prepare deployment folder
      - name: Prepare deploy folder
        run: |
          rm -rf deploy
          mkdir deploy
          cp -r .next deploy/.next
          cp -r public deploy/public
          cp server.js deploy/server.js
          cp web.config deploy/web.config
          cp package.json deploy/package.json

      # Commit & push deploy files to dev branch
      - name: Commit and push build artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add deploy
          git commit -m "ci: build next.js and update deploy artifacts" || echo "No changes to commit"
          git push origin dev
